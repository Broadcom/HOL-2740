# --- frontend ---
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: avimart-nginx-conf
  namespace: avimart
data:
  env-config.js: |
    window.__env__ = {
      attackLabUrl: "https://waflab.site-a.vcf.lab"
    };
  default.conf: |
    server {
        listen 3000;
        root /usr/share/nginx/html;
        index index.html;

        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: avimart-frontend
  namespace: avimart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: avimart-frontend
  template:
    metadata:
      labels:
        app: avimart-frontend
        tier: app
    spec:
      containers:
      - name: frontend
        image: harbor.site-a.vcf.lab/library/avimart:frontend-v1
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        resources:
          requests: { cpu: 50m, memory: 64Mi }
          limits:   { cpu: 200m, memory: 128Mi }
        volumeMounts:
        - name: nginx-conf
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
        - name: nginx-conf
          mountPath: /usr/share/nginx/html/env-config.js
          subPath: env-config.js
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: nginx-conf
        configMap:
          name: avimart-nginx-conf
---
apiVersion: v1
kind: Service
metadata:
  name: avimart-frontend
  namespace: avimart
spec:
  selector:
    app: avimart-frontend
  ports:
  - port: 3000
    targetPort: 3000

