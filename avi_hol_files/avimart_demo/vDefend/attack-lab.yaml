apiVersion: apps/v1
kind: Deployment
metadata:
  name: waf-attack-lab
  namespace: avimart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: waf-attack-lab
  template:
    metadata:
      labels:
        app: waf-attack-lab
        tier: app
    spec:
      containers:
      - name: attack-lab
        image: chrismentjox/avimart:attack-lab-v1
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
        env:
        - name: AVIMART_TARGET_URL
          value: "http://product-svc.avimart.svc.cluster.local:8080"
        - name: AVIMART_WAF_URL
          value: "http://avimart.k8s.fqdn.nl"
        - name: AVIMART_VULN_SVC_URL
          value: "http://vuln-svc.avimart.svc.cluster.local:8080"
        - name: NSX_HOST
          value: "sfo-w01-nsx01.sfo.rainpole.io"
        - name: NSX_USER
          valueFrom:
            secretKeyRef:
              name: nsx-dfw-creds
              key: user
        - name: NSX_PASSWORD
          valueFrom:
            secretKeyRef:
              name: nsx-dfw-creds
              key: password
        resources:
          requests: { cpu: 50m, memory: 64Mi }
          limits:   { cpu: 200m, memory: 256Mi }
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: waf-attack-lab
  namespace: avimart
spec:
  selector:
    app: waf-attack-lab
  ports:
  - port: 5001
    targetPort: 5000
