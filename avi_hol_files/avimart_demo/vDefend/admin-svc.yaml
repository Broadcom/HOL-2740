# admin-svc — INTERNAL ONLY
# This service has intentionally NO external HTTPRoute.
# It is only reachable east-west within the avimart namespace.
# The vDefend lateral movement demo uses vuln-svc SSRF to probe this service.
# Antrea ClusterNetworkPolicy in antrea-policies.yaml blocks this pivot.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-svc
  namespace: avimart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-svc
  template:
    metadata:
      labels:
        app: admin-svc
        tier: app
    spec:
      containers:
      - name: admin-svc
        image: chrismentjox/avimart:admin-svc-v1
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: avimart-db-secret
              key: DATABASE_URL
        resources:
          requests: { cpu: 50m, memory: 64Mi }
          limits:   { cpu: 200m, memory: 128Mi }
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: admin-svc
  namespace: avimart
spec:
  selector:
    app: admin-svc
  ports:
  - port: 8080
    targetPort: 8080
