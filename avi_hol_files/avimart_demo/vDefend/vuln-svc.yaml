apiVersion: apps/v1
kind: Deployment
metadata:
  name: vuln-svc
  namespace: avimart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vuln-svc
  template:
    metadata:
      labels:
        app: vuln-svc
        tier: app
    spec:
      containers:
      - name: vuln-svc
        image: chrismentjox/avimart:vuln-svc-v1
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        resources:
          requests: { cpu: 50m, memory: 64Mi }
          limits:   { cpu: 200m, memory: 128Mi }
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: vuln-svc
  namespace: avimart
spec:
  selector:
    app: vuln-svc
  ports:
  - port: 8080
    targetPort: 8080
