  - id: HOL-2740-03
    title: "HOL-2740-03 - Load balancing VCF apps with Avi"
    modules:
      - name: "Module 1 - No Pre-Provisioning Required"
        description: "Starting state for the lab; nothing needs to be pre-provisioned."
        playbook: ../module-scripts/2740-03-module_1.yaml
      - name: "Module 2 - Deploy Application Virtual Services"
        description: "Deploys the adv-app-a, secure-app-a (SSL), and tenant-app-a virtual services for region a. NOTE: identical to Module 3 below — needs real distinct content."
        playbook: ../module-scripts/2740-03-module_2.yaml
      - name: "Module 3 - Deploy Application Virtual Services"
        description: "Deploys the adv-app-a, secure-app-a (SSL), and tenant-app-a virtual services for region a. NOTE: identical to Module 2 above — needs real distinct content."
        playbook: ../module-scripts/2740-03-module_3.yaml

  - id: HOL-2740-04
    title: "HOL-2740-04 - Increase app resiliency with VMware Avi load balancer"
    modules:
      - name: "Module 1 - GSLB Infrastructure Dependencies"
        description: "Reviews the foundation components (base load-balancing virtual services in both regions) that GSLB infrastructure depends on."
        playbook: ../module-scripts/2740-04-module_1.yaml
      - name: "Module 2 - Building a GSLB Infrastructure"
        description: "Deploys the global DNS virtual services and service engine groups per region, then federates the GSLB cluster and geo database profile."
        playbook: ../module-scripts/2740-04-module_2.yaml
      - name: "Module 3 - Creating a Basic Global Service"
        description: "Creates a basic round-robin GSLB service fronting the basic-app virtual services in both regions."
        playbook: ../module-scripts/2740-04-module_3.yaml
      - name: "Module 4 - Creating an Advanced Global Service"
        description: "Creates an advanced GSLB service with priority-based pools and fallback members fronting the adv-app virtual services."
        playbook: ../module-scripts/2740-04-module_4.yaml
      - name: "Module 5 - Creating a Geo-Aware Global Service"
        description: "Creates a geo-aware GSLB service that routes clients by location using the geo pool algorithm."
        playbook: ../module-scripts/2740-04-module_5.yaml
      - name: "Module 6 - DNS Policy and Static DNS Records Management"
        description: "Fast-forwards through modules 1-5 so the student can start on DNS policy and static DNS record management."
        playbook: ../module-scripts/2740-04-module_6.yaml

  - id: HOL-2740-05
    title: "HOL-2740-05 - Migrating Legacy Load Balancing using Avi Conversion Tool"
    modules:
      - name: "Module 1 - Import Legacy Config"
        description: "Imports an example legacy load balancer configuration for migration."
        playbook: ../module-scripts/2740-05-module_1.yaml

