# python_bin: absolute path to the python binary inside the venv that has
# ansible-playbook installed (e.g. /home/holuser/py312venv/bin/python).
# Set to null to fall back to standard PATH resolution.
config:
  python_bin: /home/holuser/py312venv/bin/python

skus:
  - id: HOL-2740-01
    title: "HOL-2740-01 - App security in VKS with vDefend and Avi"
    modules:
      - name: "Module 1 - Prepare Avi / vDefend container security lab"
        description: "Deploys the 3 tier app, the antrea interworking configuration, and the avimart manifests"
        playbook: ../module-scripts/2740-01-module_1.yaml

