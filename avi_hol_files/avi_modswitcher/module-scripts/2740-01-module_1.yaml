---
- hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: /home/holuser/py312venv/bin/python3
  tasks:

  - name: Install the Antrea interworking configuration
    kubernetes.core.k8s:
      state: present
      definition: "{{ lookup('file', '/hol/hol-2740/avimart_demo/antrea-addonconfig.yaml') | from_yaml }}"
      context: "Supervisor"

  - name: Change the active kubeconfig context globally on disk
    ansible.builtin.shell:
      cmd: kubectl config use-context workload-cluster-1

  - name: Run setup script
    ansible.builtin.shell:
      cmd: source ./prepare-demo.sh
      chdir: /hol/hol-2740/avimart_demo/
      executable: /bin/bash
    environment:
      AVI_HOST: 'alb-a.site-a.vcf.lab'
      NSX_HOST: 'nsx-wld01-a.site-a.vcf.lab'
      AVI_USER: 'admin'
      AVI_PASSWORD: "{{ lookup('ansible.builtin.file', '/home/holuser/creds.txt') | trim }}"
      NSX_USER: 'admin'
      NSX_PASSWORD: "{{ lookup('ansible.builtin.file', '/home/holuser/creds.txt') | trim }}"
    register: script_output

  - name: Print the script stdout
    ansible.builtin.debug:
      var: script_output.stdout_lines

  # mysql-db is built directly via the vCenter REST API instead of a VM
  # Operator/VPC-networked VirtualMachine (the old mysql-vm.yaml.j2 approach,
  # attached to subnet-public1). Reason: subnet-public1 lives in whatever NSX
  # Project owns this namespace's VPC (Acme-East-A here), and a DFW policy
  # created in the Default project -- which is where 3tierapp-db_policy and
  # every other security-policy/group in this repo live -- never gets
  # realized against objects in a different Project. That's not a bug to
  # work around with cross-Project Shares; it's project isolation working as
  # designed. The fix is to put mysql-db back in Default-project scope, on
  # the same classic NSX segment (wld01-servers) that site1web1/site1web2
  # already use -- confirmed live 2026-08-29 tracing exactly this symptom
  # (a pod with no Antrea Egress-CR membership could still reach mysql-db on
  # 3306 despite a DFW DROP rule that should have blocked it).
  - name: Authenticate to vCenter (workload domain)
    ansible.builtin.uri:
      url: "https://vc-wld01-a.site-a.vcf.lab/api/session"
      method: POST
      url_username: "administrator@wld.sso"
      url_password: "{{ lookup('ansible.builtin.file', '/home/holuser/creds.txt') | trim }}"
      force_basic_auth: true
      validate_certs: false
      status_code: 201
    register: vc_session
    no_log: true

  - name: Set vCenter session header fact
    ansible.builtin.set_fact:
      vc_headers:
        vmware-api-session-id: "{{ vc_session.json }}"
    no_log: true

  - name: Check for an already-existing mysql-db VM
    ansible.builtin.uri:
      url: "https://vc-wld01-a.site-a.vcf.lab/api/vcenter/vm"
      method: GET
      headers: "{{ vc_headers }}"
      validate_certs: false
    register: vc_existing_vms

  # Explicit empty-string fallback rather than `| first` on a possibly-empty
  # selectattr result (which raises) or `default(None)` (which some Ansible
  # versions render as the truthy *string* "None" once passed back through
  # a `{{ }}` template, silently breaking every `when: not
  # existing_mysql_db_vm_id` guard below).
  - name: Note whether mysql-db already exists
    ansible.builtin.set_fact:
      existing_mysql_db_vm_id: >-
        {{ (vc_existing_vms.json | selectattr('name', 'equalto', 'mysql-db') | map(attribute='vm') | list)[0]
           if (vc_existing_vms.json | selectattr('name', 'equalto', 'mysql-db') | list | length > 0)
           else '' }}

  - name: Generate a unique cloud-init instance-id
    ansible.builtin.command: uuidgen
    register: mysql_db_instance_id
    changed_when: false
    when: not existing_mysql_db_vm_id

  - name: Render mysql-db cloud-init user-data
    ansible.builtin.set_fact:
      mysql_db_userdata_b64: "{{ lookup('ansible.builtin.template', '/hol/hol-2740/3-TierAppDeployment/codeSamples/mysql-db-cloudinit.yaml.j2') | b64encode }}"
    vars:
      db_password: "{{ lookup('ansible.builtin.file', '/home/holuser/creds.txt') | trim }}"
    when: not existing_mysql_db_vm_id

  - name: List content library IDs
    ansible.builtin.uri:
      url: "https://vc-wld01-a.site-a.vcf.lab/api/content/library"
      method: GET
      headers: "{{ vc_headers }}"
      validate_certs: false
    register: vc_library_ids
    when: not existing_mysql_db_vm_id

  - name: Get details for each content library
    ansible.builtin.uri:
      url: "https://vc-wld01-a.site-a.vcf.lab/api/content/library/{{ item }}"
      method: GET
      headers: "{{ vc_headers }}"
      validate_certs: false
    loop: "{{ vc_library_ids.json }}"
    register: vc_library_details
    when: not existing_mysql_db_vm_id

  - name: Find the CloudImages library id
    ansible.builtin.set_fact:
      cloudimages_library_id: "{{ (vc_library_details.results | selectattr('json.name', 'equalto', 'CloudImages') | map(attribute='item') | first) }}"
    when: not existing_mysql_db_vm_id

  - name: List items in the CloudImages library
    ansible.builtin.uri:
      url: "https://vc-wld01-a.site-a.vcf.lab/api/content/library/item?library_id={{ cloudimages_library_id }}"
      method: GET
      headers: "{{ vc_headers }}"
      validate_certs: false
    register: vc_cloudimages_item_ids
    when: not existing_mysql_db_vm_id

  - name: Get details for each item in the CloudImages library
    ansible.builtin.uri:
      url: "https://vc-wld01-a.site-a.vcf.lab/api/content/library/item/{{ item }}"
      method: GET
      headers: "{{ vc_headers }}"
      validate_certs: false
    loop: "{{ vc_cloudimages_item_ids.json }}"
    register: vc_cloudimages_item_details
    when: not existing_mysql_db_vm_id

  - name: Find the Ubuntu 24.04 OVF item id
    ansible.builtin.set_fact:
      ubuntu_ovf_item_id: "{{ (vc_cloudimages_item_details.results | selectattr('json.name', 'equalto', 'Ubuntu 24.04') | map(attribute='item') | first) }}"
    when: not existing_mysql_db_vm_id

  - name: List vCenter networks
    ansible.builtin.uri:
      url: "https://vc-wld01-a.site-a.vcf.lab/api/vcenter/network"
      method: GET
      headers: "{{ vc_headers }}"
      validate_certs: false
    register: vc_networks
    when: not existing_mysql_db_vm_id

  - name: Find the wld01-servers network id
    ansible.builtin.set_fact:
      wld01_servers_network_id: "{{ (vc_networks.json | selectattr('name', 'equalto', 'wld01-servers') | map(attribute='network') | first) }}"
    when: not existing_mysql_db_vm_id

  - name: List vCenter resource pools
    ansible.builtin.uri:
      url: "https://vc-wld01-a.site-a.vcf.lab/api/vcenter/resource-pool"
      method: GET
      headers: "{{ vc_headers }}"
      validate_certs: false
    register: vc_resource_pools
    when: not existing_mysql_db_vm_id

  - name: Find the top-level Resources pool id
    ansible.builtin.set_fact:
      vc_resource_pool_id: "{{ (vc_resource_pools.json | selectattr('name', 'equalto', 'Resources') | map(attribute='resource_pool') | first) }}"
    when: not existing_mysql_db_vm_id

  - name: List vCenter VM folders
    ansible.builtin.uri:
      url: "https://vc-wld01-a.site-a.vcf.lab/api/vcenter/folder"
      method: GET
      headers: "{{ vc_headers }}"
      validate_certs: false
    register: vc_folders
    when: not existing_mysql_db_vm_id

  - name: Find the default vm folder id
    ansible.builtin.set_fact:
      vc_vm_folder_id: "{{ (vc_folders.json | selectattr('name', 'equalto', 'vm') | selectattr('type', 'equalto', 'VIRTUAL_MACHINE') | map(attribute='folder') | first) }}"
    when: not existing_mysql_db_vm_id

  - name: List vCenter datastores
    ansible.builtin.uri:
      url: "https://vc-wld01-a.site-a.vcf.lab/api/vcenter/datastore"
      method: GET
      headers: "{{ vc_headers }}"
      validate_certs: false
    register: vc_datastores
    when: not existing_mysql_db_vm_id

  # This workload domain only ever has the one shared vSAN datastore, so no
  # name filter -- just take whatever's first.
  - name: Use the first available datastore
    ansible.builtin.set_fact:
      vc_datastore_id: "{{ vc_datastores.json[0].datastore }}"
    when: not existing_mysql_db_vm_id

  # network_mappings' key ("VM Network") is the OVF descriptor's own internal
  # network label baked into the Ubuntu cloud image -- confirmed live
  # 2026-08-29 via the library item's `?action=filter` response. That's
  # stable across pod rebuilds; only the dvportgroup id on the right-hand
  # side is pod-specific, hence the lookup above instead of hardcoding it.
  - name: Deploy mysql-db from the Ubuntu 24.04 OVF template
    ansible.builtin.uri:
      url: "https://vc-wld01-a.site-a.vcf.lab/api/vcenter/ovf/library-item/{{ ubuntu_ovf_item_id }}?action=deploy"
      method: POST
      headers: "{{ vc_headers }}"
      validate_certs: false
      body_format: json
      body:
        target:
          resource_pool_id: "{{ vc_resource_pool_id }}"
          folder_id: "{{ vc_vm_folder_id }}"
        deployment_spec:
          name: "mysql-db"
          annotation: "3-tier app database VM -- see 2740-01-module_1.yaml for why this is deployed directly instead of via VM Operator."
          accept_all_EULA: true
          network_mappings:
            "VM Network": "{{ wld01_servers_network_id }}"
          storage_mappings: {}
          storage_provisioning: thin
          default_datastore_id: "{{ vc_datastore_id }}"
          additional_parameters:
            - "@class": "com.vmware.vcenter.ovf.property_params"
              type: PropertyParams
              properties:
                - id: instance-id
                  value: "{{ mysql_db_instance_id.stdout }}"
                - id: hostname
                  value: "mysql-db"
                - id: user-data
                  value: "{{ mysql_db_userdata_b64 }}"
      status_code: 200
    when: not existing_mysql_db_vm_id

  # Re-list rather than trust the deploy response's own resource_id field --
  # simpler and matches how the VM was located everywhere else in this task
  # (existence check above, power-on/guest-IP lookup below).
  - name: Resolve mysql-db's vm id
    ansible.builtin.uri:
      url: "https://vc-wld01-a.site-a.vcf.lab/api/vcenter/vm"
      method: GET
      headers: "{{ vc_headers }}"
      validate_certs: false
    register: vc_vms_after_deploy

  - name: Set fact for mysql-db's vm id
    ansible.builtin.set_fact:
      mysql_db_vm_id: "{{ (vc_vms_after_deploy.json | selectattr('name', 'equalto', 'mysql-db') | map(attribute='vm') | first) }}"

  - name: Power on mysql-db
    ansible.builtin.uri:
      url: "https://vc-wld01-a.site-a.vcf.lab/api/vcenter/vm/{{ mysql_db_vm_id }}/power?action=start"
      method: POST
      headers: "{{ vc_headers }}"
      validate_certs: false
      status_code: [204, 400]
    when: not existing_mysql_db_vm_id

  # /guest/networking/interfaces 503s ("VMware Tools are not running") until
  # cloud-init's first boot finishes bringing up Tools -- tolerate that and
  # keep polling rather than failing the task. `state == 'PREFERRED'` picks
  # the real IPv4 address out of the interface's address list (which also
  # includes a link-local IPv6 entry).
  - name: Wait for mysql-db to report a guest IP
    ansible.builtin.uri:
      url: "https://vc-wld01-a.site-a.vcf.lab/api/vcenter/vm/{{ mysql_db_vm_id }}/guest/networking/interfaces"
      method: GET
      headers: "{{ vc_headers }}"
      validate_certs: false
      status_code: [200, 503]
    register: mysql_db_guest_net
    until: >-
      mysql_db_guest_net.status == 200 and
      (mysql_db_guest_net.json | selectattr('ip', 'defined') | map(attribute='ip.ip_addresses') | sum(start=[])
        | selectattr('state', 'equalto', 'PREFERRED') | list | length) > 0
    retries: 30
    delay: 10

  - name: Store Database Node IP internally
    ansible.builtin.set_fact:
      global_db_ip: >-
        {{ (mysql_db_guest_net.json | selectattr('ip', 'defined') | map(attribute='ip.ip_addresses') | sum(start=[])
            | selectattr('state', 'equalto', 'PREFERRED') | map(attribute='ip_address') | first) }}

  - name: Create a namespace called '3tierapp'
    kubernetes.core.k8s:
      state: present
      definition:
        apiVersion: v1
        kind: Namespace
        metadata:
          name: 3tierapp

  - name: Parse backend template and apply to cluster
    kubernetes.core.k8s:
      context: "workload-cluster-1"
      state: present
      namespace: 3tierapp
      definition: "{{ lookup('ansible.builtin.template', '/hol/hol-2740/3-TierAppDeployment/codeSamples/backend-app.yaml.j2') | from_yaml_all | list }}"
    vars:
      db_vm_ip: "{{ global_db_ip }}"

  - name: Wait for Backend LoadBalancer Service to obtain an IP
    kubernetes.core.k8s_info:
      context: "workload-cluster-1"
      api_version: v1
      kind: Service
      name: backend-app-service
      namespace: 3tierapp
    register: backend_svc_info
    until: "backend_svc_info.resources[0].status.loadBalancer.ingress[0].ip is defined"
    retries: 30
    delay: 10

  - name: Store Backend Service IP internally
    ansible.builtin.set_fact:
      global_backend_ip: "{{ backend_svc_info.resources[0].status.loadBalancer.ingress[0].ip }}"

  - name: Parse frontend template and apply to cluster
    kubernetes.core.k8s:
      context: "workload-cluster-1"
      state: present
      namespace: 3tierapp
      definition: "{{ lookup('ansible.builtin.template', '/hol/hol-2740/3-TierAppDeployment/codeSamples/frontend-app.yaml.j2') | from_yaml_all | list }}"
    vars:
      backend_service_ip: "{{ global_backend_ip }}"

  - name: Wait for Frontend LoadBalancer Service to obtain an IP
    kubernetes.core.k8s_info:
      context: "workload-cluster-1"
      api_version: v1
      kind: Service
      name: frontend-app-service
      namespace: 3tierapp
    register: frontend_svc_info
    until: "frontend_svc_info.resources[0].status.loadBalancer.ingress[0].ip is defined"
    retries: 30
    delay: 10

  - name: Store Frontend Service IP internally
    ansible.builtin.set_fact:
      global_frontend_ip: "{{ frontend_svc_info.resources[0].status.loadBalancer.ingress[0].ip }}"
  
  - name: Authenticate with Technitium DNS
    ansible.builtin.uri:
      url: "http://dns.vcf.lab:5380/api/user/login"
      method: POST
      body_format: form-urlencoded
      body:
        user: "admin"
        pass: "{{ lookup('ansible.builtin.file', '/home/holuser/creds.txt') | trim }}"
    register: technitium_auth
    no_log: true
    environment:
      #http_proxy: http://proxy:3128
      #https_proxy: http://proxy:3128
      no_proxy: "dns.vcf.lab, localhost,127.0.0.0/8,::1,.site-a.vcf.lab,172.16.0.0/16, 192.168.0.0/16" 
      NO_PROXY: "dns.vcf.lab, localhost,127.0.0.0/8,::1,.site-a.vcf.lab,172.16.0.0/16, 192.168.0.0/16"

  - name: Create or overwrite A Record
    ansible.builtin.uri:
      url: "http://dns.vcf.lab:5380/api/zones/records/add"
      method: POST
      body_format: form-urlencoded
      body:
        token: "{{ technitium_auth.json.token }}"
        domain: "3tierapp.site-a.vcf.lab"
        zone: "site-a.vcf.lab"
        type: "A"
        ipAddress: "{{ global_frontend_ip }}" # The IP you grabbed from your kubectl task
        ttl: "3600"
        overwrite: "true"
    # Optional: URI module will always report 'changed' on a successful POST. 
    # You can suppress that if you want strict visual idempotency in your playbook output.
    changed_when: false
    environment:
      #http_proxy: http://proxy:3128
      #https_proxy: http://proxy:3128
      no_proxy: "dns.vcf.lab, localhost,127.0.0.0/8,::1,.site-a.vcf.lab,172.16.0.0/16, 192.168.0.0/16" 
      NO_PROXY: "dns.vcf.lab, localhost,127.0.0.0/8,::1,.site-a.vcf.lab,172.16.0.0/16, 192.168.0.0/16"

  - name: Create or overwrite A Record
    ansible.builtin.uri:
      url: "http://dns.vcf.lab:5380/api/zones/records/add"
      method: POST
      body_format: form-urlencoded
      body:
        token: "{{ technitium_auth.json.token }}"
        domain: "3tierapp-db.site-a.vcf.lab"
        zone: "site-a.vcf.lab"
        type: "A"
        ipAddress: "{{ global_db_ip }}" # The IP you grabbed from your kubectl task
        ttl: "3600"
        overwrite: "true"
    # Optional: URI module will always report 'changed' on a successful POST. 
    # You can suppress that if you want strict visual idempotency in your playbook output.
    changed_when: false
    environment:
      #http_proxy: http://proxy:3128
      #https_proxy: http://proxy:3128
      no_proxy: "dns.vcf.lab, localhost,127.0.0.0/8,::1,.site-a.vcf.lab,172.16.0.0/16, 192.168.0.0/16" 
      NO_PROXY: "dns.vcf.lab, localhost,127.0.0.0/8,::1,.site-a.vcf.lab,172.16.0.0/16, 192.168.0.0/16"

  - name: Add MySQL DB host dynamically
    ansible.builtin.add_host:
      name: 3tierapp-db.site-a.vcf.lab

- name: Resolve MySQL blocked host issue
  hosts: 3tierapp-db.site-a.vcf.lab
  remote_user: holuser
  gather_facts: false

  tasks:
    - name: Wait for the host to be reachable via SSH
      ansible.builtin.wait_for_connection:
        delay: 20     # Number of seconds to wait before starting the check
        timeout: 300  # Maximum number of seconds to wait for a successful connection

    - name: Execute mysqladmin to flush hosts
      ansible.builtin.command: "mysqladmin -u root -p'{{ lookup('ansible.builtin.file', '/home/holuser/creds.txt') | trim }}' flush-hosts"
      register: flush_result
      # Optional: Use 'become: true' if holuser needs sudo to run this
      
    - name: Display flush command output
      ansible.builtin.debug:
        var: flush_result.stdout

    - name: Increase max_connect_errors limit dynamically
      ansible.builtin.command: "mysql -u root -p'{{ lookup('ansible.builtin.file', '/home/holuser/creds.txt') | trim }}' -e 'SET GLOBAL max_connect_errors = 4294967295;'"
      register: set_var_result
      
    - name: Display set variable output
      ansible.builtin.debug:
        var: set_var_result.stdout