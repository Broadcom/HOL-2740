- debug:
    msg: "Running 2137-02 module 3 role"
- pause:
    seconds: 2

- name: Collect adv-app-a details
  vmware.alb.avi_api_session:
    avi_credentials: "{{ avi_creds_region01a }}"
    http_method: get
    path: virtualservice
    params:
      { name: adv-app-a }
  register: vs_app_01a

- name: Collect adv-app-a details
  vmware.alb.avi_api_session:
    avi_credentials: "{{ avi_creds_region01a }}"
    http_method: get
    path: vsvip
    params:
      { name.contains: adv-app-a }
  register: vsvip_app_01a

- name: Collect adv-app-b details
  vmware.alb.avi_api_session:
    avi_credentials: "{{ avi_creds_region01b }}"
    http_method: get
    path: virtualservice
    params:
      { name: adv-app-b }
  register: vs_app_01b

- name: Collect adv-app-b details
  vmware.alb.avi_api_session:
    avi_credentials: "{{ avi_creds_region01b }}"
    http_method: get
    path: vsvip
    params:
      { name.contains: adv-app-b }
  register: vsvip_app_01b

- name: Verify the virtual services the global service needs exist
  ansible.builtin.assert:
    that:
      - vs_app_01a['obj']['count'] | int > 0
      - vsvip_app_01a['obj']['count'] | int > 0
      - vs_app_01b['obj']['count'] | int > 0
      - vsvip_app_01b['obj']['count'] | int > 0
    fail_msg: "A virtual service this global service points at was not found - check the lookups above"

- name: Collect region01a cluster details
  vmware.alb.avi_api_session:
    avi_credentials: "{{ avi_creds_region01a }}"
    http_method: get
    path: cluster
  register: cluster_region01a

- name: Collect region01b cluster details
  vmware.alb.avi_api_session:
    avi_credentials: "{{ avi_creds_region01b }}"
    http_method: get
    path: cluster
  register: cluster_region01b

- set_fact:
    region_placeholder: "{{region}}"

- name: Define basic GS
  import_role:
    name: vmware.alb.aviconfig
  vars:
    avi_credentials: "{{ avi_creds_region01a }}"

    region: "{{region_placeholder}}"
    avi_config:
      gslbservice:
        - name: basic-app.global.vcf.lab
          controller_health_status_enabled: true
          enabled: true
          is_federated: true
          domain_names:
            - basic-app.global.vcf.lab
          health_monitor_refs:
            - '/api/healthmonitor?name=System-GSLB-HTTP'
          groups:
            - priority: 20
              members:
                - cluster_uuid: "{{ cluster_region01a['obj'].uuid }}"
                  vs_uuid: "{{ vs_app_01a['obj']['results'][0]['uuid'] }}"
                  ip:
                    type: V4
                    addr: "{{ vsvip_app_01a['obj']['results'][0]['vip'][0]['ip_address']['addr'] }}"
                  ratio: 1
                  enabled: true
              enabled: true
              name: Palo Alto
              algorithm: GSLB_ALGORITHM_ROUND_ROBIN
            - priority: 10
              members:
                - cluster_uuid: "{{ cluster_region01b['obj'].uuid }}"
                  vs_uuid: "{{ vs_app_01b['obj']['results'][0]['uuid'] }}"
                  ip:
                    type: V4
                    addr: "{{ vsvip_app_01b['obj']['results'][0]['vip'][0]['ip_address']['addr'] }}"
                  ratio: 1
                  enabled: true
              enabled: true
              name: Barcelona
              algorithm: GSLB_ALGORITHM_ROUND_ROBIN
          health_monitor_scope: GSLB_SERVICE_HEALTH_MONITOR_ALL_MEMBERS
          pool_algorithm: GSLB_SERVICE_ALGORITHM_PRIORITY
