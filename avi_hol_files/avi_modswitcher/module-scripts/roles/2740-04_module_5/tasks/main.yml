- debug:
    msg: "Running 2137-02 module 5 role"
- pause:
    seconds: 2

- name: Collect secure-app-a details
  vmware.alb.avi_api_session:
    avi_credentials: "{{ avi_creds_region01a }}"
    http_method: get
    path: virtualservice

    params:
      { name: secure-app-a }
  register: vs_secure_app_a

- name: Collect secure-app-a details
  vmware.alb.avi_api_session:
    avi_credentials: "{{ avi_creds_region01a }}"
    http_method: get
    path: vsvip
    params:
      { name.contains: secure-app-a }
  register: vsvip_secure_app_a

- name: Collect secure-app-b details
  vmware.alb.avi_api_session:
    avi_credentials: "{{ avi_creds_region01b }}"
    http_method: get
    path: virtualservice
    params:
      { name: secure-app-b }
  register: vs_secure_app_b

- name: Collect secure-app-b details
  vmware.alb.avi_api_session:
    avi_credentials: "{{ avi_creds_region01b }}"
    http_method: get
    path: vsvip
    params:
      { name.contains: secure-app-b }
  register: vsvip_secure_app_b

- name: Verify the virtual services the global service needs exist
  ansible.builtin.assert:
    that:
      - vs_secure_app_a['obj']['count'] | int > 0
      - vsvip_secure_app_a['obj']['count'] | int > 0
      - vs_secure_app_b['obj']['count'] | int > 0
      - vsvip_secure_app_b['obj']['count'] | int > 0
    fail_msg: "A virtual service this global service points at was not found - check the lookups above"

- name: Collect region01a cluster details
  vmware.alb.avi_api_session:
    avi_credentials: "{{ avi_creds_region01a }}"
    http_method: get
    path: cluster
  register: cluster_region01a

- name: Collect region01b cluster details
  vmware.alb.avi_api_session:
    avi_credentials: "{{ avi_creds_region01b }}"
    http_method: get
    path: cluster
  register: cluster_region01b

- set_fact:
    region_placeholder: "{{region}}"

- name: Define geo GS
  import_role:
    name: vmware.alb.aviconfig
  vars:
    avi_credentials: "{{ avi_creds_region01a }}"
    region: "{{region_placeholder}}"
    avi_config:
      gslbservice:
        - name: secure-app.global.vcf.lab
          controller_health_status_enabled: true
          down_response:
            type: GSLB_SERVICE_DOWN_RESPONSE_NONE
          enabled: true
          is_federated: true
          domain_names:
            - secure-app.global.vcf.lab
          health_monitor_refs:
            - '/api/healthmonitor?name=System-GSLB-HTTP'
          use_edns_client_subnet: true
          groups:
            - priority: 10
              members:
                - ratio: 1
                  ip:
                    type: V4
                    addr: "{{ vsvip_secure_app_a['obj']['results'][0]['vip'][0]['ip_address']['addr'] }}"
                  enabled: true
                  vs_uuid: "{{ vs_secure_app_a['obj']['results'][0]['uuid'] }}"
                  location:
                    source: GSLB_LOCATION_SRC_INHERIT_FROM_SITE
                  cluster_uuid: "{{ cluster_region01a['obj'].uuid }}"
                - ratio: 1
                  ip:
                    type: V4
                    addr: "{{ vsvip_secure_app_b['obj']['results'][0]['vip'][0]['ip_address']['addr'] }}"
                  enabled: true
                  vs_uuid: "{{ vs_secure_app_b['obj']['results'][0]['uuid'] }}"
                  location:
                    source: GSLB_LOCATION_SRC_INHERIT_FROM_SITE
                  cluster_uuid: "{{ cluster_region01b['obj'].uuid }}"
              enabled: true
              name: Palo Alto
              algorithm: GSLB_ALGORITHM_GEO
          site_persistence_enabled: false
          min_members: 0
          health_monitor_scope: GSLB_SERVICE_HEALTH_MONITOR_ALL_MEMBERS
          pool_algorithm: GSLB_SERVICE_ALGORITHM_GEO
