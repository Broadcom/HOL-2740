# Self-documenting playbook for the workload-domain Avi Controller
# (alb-a.site-a.vcf.lab / cloud "Cloud-nsx-wld01-a"). Originally captured as a
# live-config snapshot on 2026-07-27, then reconciled against the intended
# state in avi_configs/avi_config.yml/avi_tweaks.yml task by task - this is
# now meant to run every time the pod starts, same as the original template,
# not just as a passive reference.
#
# Every field below reflects a deliberate decision, not just "whatever the
# controller happened to have": some fields match the original template's
# intent (controller properties, true-client-IP/HSTS tweaks, SE self-election,
# demo_vs/dns-vs-01a analytics_policy - all of these were live gaps, now
# closed), others deliberately preserve current live values over the
# template's stale intent (SE group memory/disk/max_vs_per_se sizing,
# state_based_dns_registration, the portal's SSL cert). See inline comments
# on each task for which case applies.
#
# WHAT THIS DELIBERATELY DOES NOT COVER:
#   - Licensing: this controller is on a Broadcom-issued subscription license
#     applied automatically by VCF Operations, not a static serial key. There
#     is no "Apply License Key" task here (unlike the original template) —
#     reapplying an old eval-style serial would be wrong for this build.
#   - system config bootstrap (DNS/NTP/welcome_workflow/sddcmanager_fqdn) and
#     the portal's SSL cert: these were set once during initial VCF bring-up
#     (portal cert specifically is provisioned by VCF on this 9.1+ build) and
#     are shown below as commented reference only, never applied. The one
#     active systemconfiguration task in this file (registering
#     dns_virtualservice_refs) is scoped to that single field only and does
#     not touch portal_configuration or anything else in this bucket.
#   - Supervisor/VKS-managed objects: this cloud carries several pools,
#     VsVips, and VirtualServices whose names are content hashes (e.g.
#     "5dcb84b1-dbd--kube-system-kube-apiserver-lb-svc..."). Those are
#     created/deleted automatically by the Supervisor cluster's own load
#     balancer integration (NCP/Avi) — do not manage them here. See the
#     "Observed but unmanaged" note near the bottom.
#   - Uploading the actual private key material for the "hol_wildcard" /
#     "vcf_lab_root" certs: Avi never returns private keys via the API
#     (they always read back as "<sensitive>"), so this playbook cannot
#     recover them. The sslkeyandcertificate tasks below assume the same
#     PEM files used at initial buildout are still available locally.
---
- hosts: localhost
  connection: local
  gather_facts: no
  vars_files:
    - inv_wld_a.yml
  vars:
    avi_credentials:
      controller: "{{ avi_controller }}"
      username: admin
      password: "{{ lookup('ansible.builtin.file', '/home/holuser/creds.txt') }}"
      api_version: "{{ api_version }}"

  collections:
    - vmware.alb

  tasks:
    - name: "Wait for the portal to become active"
      uri:
        url: "https://{{ avi_controller_fqdn }}/api/initial-data"
        validate_certs: no
        status_code: 200
      register: result
      until: result.status == 200
      retries: 300
      delay: 10

    - name: "Verify vCenter API is responding"
      uri:
        url: "https://{{ vcenter_name }}/api/session"
        method: POST
        url_username: "administrator@wld.sso"
        url_password: "{{ lookup('ansible.builtin.file', '/home/holuser/creds.txt') }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: 201
      register: vcenter_check
      until: vcenter_check.status == 201
      retries: 300
      delay: 10

    - name: "Close vCenter API session"
      uri:
        url: "https://{{ vcenter_name }}/api/session"
        method: DELETE
        headers:
          vmware-api-session-id: "{{ vcenter_check.json }}"
        validate_certs: no
        status_code: 204

    - name: "Verify NSX Manager API is responding"
      uri:
        url: "https://{{ nsxt_url }}/api/v1/node"
        method: GET
        url_username: admin
        url_password: "{{ lookup('ansible.builtin.file', '/home/holuser/creds.txt') }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: 200
      register: nsx_check
      until: nsx_check.status == 200
      retries: 300
      delay: 10

    # -----------------------------------------------------------------
    # Reference only — set once by VCF at initial bring-up. Not replayed.
    # -----------------------------------------------------------------
    # - name: Basic system configuration (REFERENCE ONLY - do not run)
    #   vmware.alb.avi_systemconfiguration:
    #     avi_credentials: "{{ avi_credentials }}"
    #     welcome_workflow_complete: true
    #     default_license_tier: ENTERPRISE
    #     dns_configuration:
    #       server_list:
    #         - addr: 10.1.1.1
    #           type: V4
    #     ntp_configuration:
    #       ntp_servers:
    #         - server:
    #             addr: 10.1.1.1
    #             type: V4
    #     # sddcmanager_fqdn: sddcmanager-a.site-a.vcf.lab   (set by VCF, not user-settable here)

    - name: "Controller properties (template intent - was missing live, now enforced)"
      vmware.alb.avi_controllerproperties:
        avi_credentials: "{{ avi_credentials }}"
        shared_ssl_certificates: true
        api_idle_timeout: 1440



    - name: Create first Avi Cloud Connector User
      vmware.alb.avi_cloudconnectoruser:
        avi_credentials: "{{ avi_credentials }}"
        name: "vcenter_admin"
        # Change this block if using AWS/Azure/NSX-T credentials
        vcenter_credentials:
          username: "administrator@wld.sso"
          password: "{{ lookup('ansible.builtin.file', '/home/holuser/creds.txt') }}"
      register: cc_user1

    - name: Create second Avi Cloud Connector User
      vmware.alb.avi_cloudconnectoruser:
        avi_credentials: "{{ avi_credentials }}"
        name: "nsx_admin"
        nsxt_credentials:
          username: "admin"
          password: "{{ lookup('ansible.builtin.file', '/home/holuser/creds.txt') }}"
      register: cc_user2

    - name: Check for cloud
      vmware.alb.avi_api_session:
        avi_credentials: "{{ avi_credentials }}"
        http_method: get
        path: vcenterserver
        params: 
          name: "{{ vcenter_name }}"
      register: vcenter_lookup

    - name: "edit vcenter server configuration"
      vmware.alb.avi_api_session:
        avi_credentials: "{{ avi_credentials }}"
        http_method: patch 
        path: "vcenterserver/{{ vcenter_lookup.obj.results[0].uuid }}"
        data:
          replace:
            vcenter_credentials_ref: "{{ cc_user1.obj.url }}"

 
    # Backup configuration is VCF Operations' to manage, not ours - do NOT
    # add a task for it here. (There used to be one; it did a full PUT that
    # silently dropped ssh_user_ref, since that field is never readable via
    # the API and so never gets specified - which broke the actual SFTP
    # upload to SDDC Manager on the next backup cycle. Confirmed on a real
    # pod run. Left as a warning, not a TODO: don't re-add this task.)

    # wld01-avi-data is auto-created/synced from the NSX-T segment by the
    # cloud connector (attrs.segmentid, attrs.autocreated, synced_from_se:
    # true) - it already exists by the time this playbook runs. A full
    # create/PUT against it fails outright ("Removal of key value attrs
    # segmentid ... is not allowed") because the payload doesn't include
    # those NSX-owned attrs. Network objects should never be created here;
    # only patched to add/ensure the VIP+SE static IP range on top of what
    # NSX sync already established. Scoped to configured_subnets only -
    # nothing else on this object is ours to touch.
    - name: "VIP/SE data network - {{ vip_network_name }} (patch static IP range only)"
      vmware.alb.avi_network:
        avi_credentials: "{{ avi_credentials }}"
        avi_api_patch_op: replace
        avi_api_update_method: patch
        name: "{{ vip_network_name }}"
        configured_subnets:
          - prefix:
              ip_addr:
                addr: "{{ vip_network_subnet }}"
                type: V4
              mask: "{{ vip_network_mask }}"
            static_ip_ranges:
              - range:
                  begin:
                    addr: "{{ vip_se_range_begin }}"
                    type: V4
                  end:
                    addr: "{{ vip_se_range_end }}"
                    type: V4
                type: "STATIC_IPS_FOR_VIP_AND_SE"

    - name: "IPAM profile for {{ cloud_name }}"
      vmware.alb.avi_ipamdnsproviderprofile:
        avi_credentials: "{{ avi_credentials }}"
        name: "{{ ipam_profile_name }}"
        type: IPAMDNS_TYPE_INTERNAL
        internal_profile:
          ttl: 30
          usable_networks:
            - nw_ref: "/api/network?name={{ vip_network_name }}"

    - name: "DNS profile for {{ cloud_name }} - serves lb.site-a.vcf.lab, vks1.site-a.vcf.lab, vks2.site-a.vcf.lab"
      vmware.alb.avi_ipamdnsproviderprofile:
        avi_credentials: "{{ avi_credentials }}"
        name: "{{ dns_profile_name }}"
        type: IPAMDNS_TYPE_INTERNAL_DNS
        internal_profile:
          ttl: 30
          dns_service_domain:
            - domain_name: lb.site-a.vcf.lab
              pass_through: true
            - domain_name: vks1.site-a.vcf.lab
              pass_through: true
            - domain_name: vks2.site-a.vcf.lab
              pass_through: true
        tenant: admin

    - name: "Wire IPAM/DNS profiles into the cloud, change usernamepassword"
      vmware.alb.avi_cloud:
        avi_credentials: "{{ avi_credentials }}"
        avi_api_patch_op: replace
        avi_api_update_method: patch
        name: "{{ cloud_name }}"
        dns_provider_ref: "/api/ipamdnsproviderprofile?name={{ dns_profile_name }}"
        ipam_provider_ref: "/api/ipamdnsproviderprofile?name={{ ipam_profile_name }}"
        nsxt_configuration:
          nsxt_credentials_ref: "{{ cc_user2.obj.url }}"

    - name: Wait for the Cloud to become placement ready
      vmware.alb.avi_api_session:
        avi_credentials: "{{ avi_credentials }}"
        http_method: get
        path: cloud-inventory
        params:
          name: "{{ cloud_name }}"
      register: cloud_runtime
      # Poll the cloud-inventory endpoint until the state reaches placement ready
      until: cloud_runtime.obj.results | length > 0 and cloud_runtime.obj.results[0].status.state == 'CLOUD_STATE_PLACEMENT_READY'
      retries: 30
      delay: 10

    # self_se_election is the only field changed here (false -> true, per
    # instruction). Every other field is left at its current live value -
    # do NOT revert disk/memory/max_vs_per_se/deprovision_delay to the
    # original template's sizing.
    - name: "Default-Group SE group sizing for {{ cloud_name }}"
      vmware.alb.avi_serviceenginegroup:
        avi_api_patch_op: replace
        avi_api_update_method: patch
        avi_credentials: "{{ avi_credentials }}"
        name: Default-Group
        cloud_ref: "/api/cloud/?name={{ cloud_name }}"
        se_name_prefix: "Avi"
        disk_per_se: 15
        cpu_reserve: false
        mem_reserve: true
        vcpus_per_se: 2
        memory_per_se: 4096
        max_vs_per_se: 100
        self_se_election: true
        se_deprovision_delay: 120

    # gslb01a is a separate, dedicated GSLB SE group on this cloud (missed
    # entirely in the original snapshot - it doesn't exist in avi_config.yml
    # at all). Same rule: only self_se_election changes (false -> true);
    # its memory_per_se is already correctly at 8GB and is left untouched.
    # - name: "gslb01a SE group sizing for {{ cloud_name }}"
    #   vmware.alb.avi_serviceenginegroup:
    #     avi_api_patch_op: replace
    #     avi_api_update_method: patch
    #     avi_credentials: "{{ avi_credentials }}"
    #     name: gslb01a
    #     cloud_ref: "/api/cloud/?name={{ cloud_name }}"
    #     se_name_prefix: "gslb01a"
    #     disk_per_se: 25
    #     cpu_reserve: false
    #     mem_reserve: false
    #     vcpus_per_se: 1
    #     memory_per_se: 8192
    #     extra_shared_config_memory: 2000
    #     max_vs_per_se: 10
    #     self_se_election: true
    #     se_deprovision_delay: 120

    # True-Client-IP / HSTS tweak from avi_tweaks.yml, applied here as
    # template-intended (this was missing live - hsts_enabled was true and
    # use_true_client_ip was false on both profiles before this).
    - name: "System-Secure-HTTP application profile - true-client-IP + HSTS tweak"
      vmware.alb.avi_applicationprofile:
        avi_credentials: "{{ avi_credentials }}"
        avi_api_patch_op: replace
        avi_api_update_method: patch
        name: System-Secure-HTTP
        type: APPLICATION_PROFILE_TYPE_HTTP
        http_profile:
          hsts_enabled: false
          true_client_ip:
            direction: LEFT
            headers:
              - X-Forwarded-For
            index_in_header: 1
          use_true_client_ip: true

    - name: "System-HTTP application profile - true-client-IP tweak"
      vmware.alb.avi_applicationprofile:
        avi_credentials: "{{ avi_credentials }}"
        avi_api_patch_op: replace
        avi_api_update_method: patch
        name: System-HTTP
        type: APPLICATION_PROFILE_TYPE_HTTP
        http_profile:
          true_client_ip:
            direction: LEFT
            headers:
              - X-Forwarded-For
            index_in_header: 1
          use_true_client_ip: true

    # -----------------------------------------------------------------
    # System-DNS is a system-default object but has been heavily
    # customized here, and this is the piece that was actually BROKEN and
    # manually fixed on this pod: each dns_zones entry's name_server had
    # been left as the bare domain_name (e.g. "lb.site-a.vcf.lab"), which
    # is wrong - name_server needs to be the FQDN of the DNS virtual
    # service actually answering for that zone. It's now
    # "dns-vs-01a.site-a.vcf.lab" for the site/VKS zones, and
    # "global-dns-vs-01a.site-a.vcf.lab" for global.vcf.lab specifically.
    # The mgmt-domain controller's System-DNS (avi_config_mgmt_a.yml) was
    # NOT affected by this and is documented there with its original,
    # still-correct values.
    # -----------------------------------------------------------------
    - name: "System-DNS application profile (current live state - authoritative zones for dns-vs-01a)"
      vmware.alb.avi_applicationprofile:
        avi_credentials: "{{ avi_credentials }}"
        avi_api_patch_op: replace
        avi_api_update_method: patch
        name: System-DNS
        type: APPLICATION_PROFILE_TYPE_DNS
        dns_service_profile:
          aaaa_empty_response: true
          admin_email: hostmaster
          client_dns_tcp_request_timeout: 10000
          close_tcp_connection_post_response: false
          dns_over_tcp_enabled: true
          ecs_stripping_enabled: true
          edns: true
          error_response: DNS_ERROR_RESPONSE_NONE
          negative_caching_ttl: 30
          num_dns_ip: 1
          ttl: 30
          domain_names:
            - lb.site-a.vcf.lab
            - global.vcf.lab
            - vks1.site-a.vcf.lab
            - vks1.vcf.lab
            - vks2.vcf.lab
            - vks2.site-a.vcf.lab
          dns_zones:
            - domain_name: lb.site-a.vcf.lab
              name_server: dns-vs-01a.site-a.vcf.lab
              admin_email: hostmaster
            - domain_name: global.vcf.lab
              name_server: global-dns-vs-01a.site-a.vcf.lab
              admin_email: hostmaster
            - domain_name: vks1.site-a.vcf.lab
              name_server: dns-vs-01a.site-a.vcf.lab
              admin_email: hostmaster
            - domain_name: vks1.vcf.lab
              name_server: dns-vs-01a.site-a.vcf.lab
              admin_email: hostmaster
            - domain_name: vks2.site-a.vcf.lab
              name_server: dns-vs-01a.site-a.vcf.lab
              admin_email: hostmaster
            - domain_name: vks2.vcf.lab
              name_server: dns-vs-01a.site-a.vcf.lab
              admin_email: hostmaster

    # Two proxy-protocol L4 app profiles exist on this cloud named after
    # object hashes (e.g. "8c8c72b5-66f-proxy-applicationprofile"). They're
    # auto-created by the Supervisor's LB integration for its own services
    # (proxy_protocol_enabled: true, version 1) - not user-managed, not
    # included here.

    - name: "System-Standard SSL profile"
      vmware.alb.avi_sslprofile:
        avi_credentials: "{{ avi_credentials }}"
        avi_api_patch_op: replace
        avi_api_update_method: patch
        name: System-Standard
        accepted_versions:
          - type: SSL_VERSION_TLS1_2
          - type: SSL_VERSION_TLS1_3
        cipher_enums:
          - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
          - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
          - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
          - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
          - TLS_AES_128_GCM_SHA256
          - TLS_CHACHA20_POLY1305_SHA256
          - TLS_AES_256_GCM_SHA384
        ciphersuites: "TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256"

    # sslkeyandcertificate: private keys never read back from the API
    # ("<sensitive>"). These tasks re-upload from local PEM files.
    #
    # NOTE: adjustomatic.py (which runs these playbooks) executes on the LAB
    # MANAGER, not the jump host/console - confirmed by actually running it.
    # /lmchol on manager is a bind mount of the Console VM's root filesystem
    # (see lab-update.sh's comment), so "/lmchol/hol/..." IS the right way
    # to reach the console's real /hol/... files from here. An earlier
    # revision of this playbook "fixed" these paths to drop the /lmchol
    # prefix on the theory that this ran on the console directly - that
    # theory was wrong; confirmed by actually running adjustomatic.py end
    # to end and watching this exact task fail without the prefix.
    - name: "CA cert - vcf_lab_root"
      vmware.alb.avi_sslkeyandcertificate:
        avi_credentials: "{{ avi_credentials }}"
        certificate:
          certificate: "{{ lookup('file', '/lmchol/hol/ssl/ca.crt') }}"
        type: SSL_CERTIFICATE_TYPE_CA
        name: vcf_lab_root
        tenant: admin

    # wildcard_cert.pem/wildcard_key.pem are the vault-created wildcard
    # cert/key for lb.site-a.vcf.lab et al. (issued by the vcf.lab Root
    # Authority CA above) - not generated by cert.directions.txt/holcert.cnf,
    # which are stale leftovers from an older cert-issuance process.
    - name: "App cert - hol_wildcard (used by demo_vs)"
      vmware.alb.avi_sslkeyandcertificate:
        avi_credentials: "{{ avi_credentials }}"
        key: "{{ lookup('file', '/lmchol/home/holuser/certificates/wildcard_key.pem') }}"
        key_passphrase: ""
        certificate:
          certificate: "{{ lookup('file', '/lmchol/home/holuser/certificates/wildcard_cert.pem') }}"
        type: SSL_CERTIFICATE_TYPE_VIRTUALSERVICE
        name: hol_wildcard
        tenant: admin

    - name: "Pool: demo_vs-Pool"
      vmware.alb.avi_pool:
        avi_credentials: "{{ avi_credentials }}"
        name: demo_vs-Pool
        cloud_ref: "/api/cloud/?name={{ cloud_name }}"
        health_monitor_refs:
          - /api/healthmonitor?name=System-HTTP
        lb_algorithm: LB_ALGORITHM_LEAST_CONNECTIONS
        tier1_lr: "/infra/tier-1s/{{ t1_id }}"
        default_server_port: "{{ worker_port }}"
        servers:
          - ip:
              addr: "{{ worker1 }}"
              type: V4
          - ip:
              addr: "{{ worker2 }}"
              type: V4
        tenant: admin

    - name: "VsVip: dns-vs-01a-VsVip"
      vmware.alb.avi_vsvip:
        avi_credentials: "{{ avi_credentials }}"
        name: "dns-vs-01{{ site_letter }}-VsVip"
        vrf_context_ref: "/api/vrfcontext/?name={{ t1_id }}"
        cloud_ref: "/api/cloud/?name={{ cloud_name }}"
        tier1_lr: "/infra/tier-1s/{{ t1_id }}"
        vip:
          - vip_id: '1'
            ip_address:
              addr: "{{ dns_vs_ip }}"
              type: V4
            enabled: true
            auto_allocate_ip: false
            auto_allocate_floating_ip: false
            avi_allocated_vip: false
            avi_allocated_fip: false
            auto_allocate_ip_type: V4_ONLY
            prefix_length: 32
        dns_info:
          - fqdn: "{{ dns_vs_fqdn }}"
            ttl: 30
            type: DNS_RECORD_A
            algorithm: DNS_RECORD_RESPONSE_CONSISTENT_HASH
        tenant: admin

    - name: "VsVip: demo_vs-VsVip"
      vmware.alb.avi_vsvip:
        avi_credentials: "{{ avi_credentials }}"
        name: demo_vs-VsVip
        vrf_context_ref: "/api/vrfcontext?name={{ t1_id }}"
        cloud_ref: "/api/cloud/?name={{ cloud_name }}"
        tier1_lr: "/infra/tier-1s/{{ t1_id }}"
        vip:
          - vip_id: '1'
            ip_address:
              addr: "{{ demo_vs_ip }}"
              type: V4
            enabled: true
            auto_allocate_ip: false
            auto_allocate_floating_ip: false
            avi_allocated_vip: false
            avi_allocated_fip: false
            auto_allocate_ip_type: V4_ONLY
            prefix_length: 32
        dns_info:
          - fqdn: "{{ demo_vs_fqdn }}"
            ttl: 30
            type: DNS_RECORD_A
            algorithm: DNS_RECORD_RESPONSE_CONSISTENT_HASH
        tenant: admin

    - name: "VirtualService: dns-vs-01a"
      vmware.alb.avi_virtualservice:
        avi_credentials: "{{ avi_credentials }}"
        name: "dns-vs-01{{ site_letter }}"
        application_profile_ref: /api/applicationprofile?name=System-DNS
        network_profile_ref: /api/networkprofile?name=System-UDP-Per-Pkt
        se_group_ref: /api/serviceenginegroup?name=Default-Group
        vrf_context_ref: "/api/vrfcontext?name={{ t1_id }}"
        cloud_ref: "/api/cloud/?name={{ cloud_name }}"
        analytics_profile_ref: /api/analyticsprofile?name=System-Analytics-Profile
        vsvip_ref: "/api/vsvip?name=dns-vs-01{{ site_letter }}-VsVip"
        services:
          - port: 53
            port_range_end: 53
            enable_ssl: false
          - port: 53
            port_range_end: 53
            enable_ssl: false
            override_network_profile_ref: /api/networkprofile?name=System-TCP-Proxy
        analytics_policy:
          full_client_logs:
            enabled: true
            duration: 0
            throttle: 10
          client_insights: NO_INSIGHTS
          all_headers: false
          metrics_realtime_update:
            enabled: false
            duration: 0
          udf_log_throttle: 10
          significant_log_throttle: 10
          learning_log_policy:
            enabled: false
        tenant: admin

    # demo_vs is intentionally site-A only (workload domain) - there is no
    # equivalent task in avi_config_mgmt_a.yml, and there shouldn't be one.
    - name: "VirtualService: demo_vs"
      vmware.alb.avi_virtualservice:
        avi_credentials: "{{ avi_credentials }}"
        name: demo_vs
        enabled: true
        application_profile_ref: /api/applicationprofile?name=System-Secure-HTTP
        se_group_ref: /api/serviceenginegroup?name=Default-Group
        vrf_context_ref: "/api/vrfcontext?name={{ t1_id }}"
        cloud_ref: "/api/cloud/?name={{ cloud_name }}"
        analytics_profile_ref: /api/analyticsprofile?name=System-Analytics-Profile
        vsvip_ref: /api/vsvip?name=demo_vs-VsVip
        services:
          - port: 80
            enable_ssl: false
            port_range_end: 80
          - port: 443
            enable_ssl: true
            port_range_end: 443
        analytics_policy:
          full_client_logs:
            enabled: true
            duration: 0
            throttle: 10
          client_insights: NO_INSIGHTS
          all_headers: false
          metrics_realtime_update:
            enabled: true
            duration: 0
          udf_log_throttle: 10
          significant_log_throttle: 10
          learning_log_policy:
            enabled: false
        network_profile_ref: /api/networkprofile?name=System-TCP-Proxy
        pool_ref: /api/pool?name=demo_vs-Pool
        ssl_key_and_certificate_refs:
          - /api/sslkeyandcertificate?name=hol_wildcard
          - /api/sslkeyandcertificate?name=System-Default-Cert-EC
        ssl_profile_ref: /api/sslprofile?name=System-Standard
        tenant: admin

    # Registers dns-vs-01a as this controller's DNS virtualservice. Scoped to
    # ONLY this field (avi_api_patch_op: add, matching the original template) -
    # does not touch portal_configuration or any other systemconfiguration
    # field. The portal's own SSL cert is provisioned by VCF on this
    # (9.1+) build and must NOT be overwritten here.
    - name: "Register dns-vs-01a as the DNS virtualservice"
      vmware.alb.avi_systemconfiguration:
        avi_credentials: "{{ avi_credentials }}"
        avi_api_patch_op: add
        avi_api_update_method: patch
        dns_virtualservice_refs:
          - "/api/virtualservice?name=dns-vs-01{{ site_letter }}"

