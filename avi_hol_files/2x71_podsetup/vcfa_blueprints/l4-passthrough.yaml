formatVersion: 1
inputs:
  namespace:
    title: Namespace
    type: string
    description: Namespace you wish to deploy to
    $data: /data/namespaces?projectId={{project}}
  vm_image_id:
    title: VM image ID
    type: string
    description: the ID of the VM image for building the virtual machine
    $data: /data/namespaceclass-vmimages
  target_port:
    title: Target Port
    type: integer
    description: Destination port on the VMs that the L4 load balancer forwards to
    default: 80
resources:
  CCI_Supervisor_Namespace_1:
    type: CCI.Supervisor.Namespace
    properties:
      name: ${input.namespace}
      existing: true
  Virtual_Machine_Service_1:
    type: CCI.Supervisor.Resource
    properties:
      context: ${resource.CCI_Supervisor_Namespace_1.id}
      manifest:
        apiVersion: vmoperator.vmware.com/v1alpha5
        kind: VirtualMachineService
        metadata:
          name: ${env.deploymentName}-vmservice
        spec:
          ports:
            - name: http
              port: 80
              protocol: TCP
              targetPort: ${input.target_port}
          selector:
            lb-selector: ${env.deploymentName}-app # This is how the LB will select VMs
          type: LoadBalancer # type LoadBalancer gets a direct L4 VS instead of the L7 Gateway API path
  Virtual_Machine_1:
    type: CCI.Supervisor.Resource
    properties:
      context: ${resource.CCI_Supervisor_Namespace_1.id}
      manifest:
        apiVersion: vmoperator.vmware.com/v1alpha5
        kind: VirtualMachine
        metadata:
          labels:
            lb-selector: ${env.deploymentName}-app # This is how the LB will select VMs
          name: ${env.deploymentName}-vm1
        spec:
          className: best-effort-xsmall
          image:
            kind: VirtualMachineImage
            name: ${input.vm_image_id} #ID of the VM image to build from
          powerState: PoweredOn
          bootstrap:
            cloudInit:
              cloudConfig:
                defaultUserEnabled: true
                runcmd:
                  - /usr/bin/apt -o acquire::http::proxy="http://10.1.1.1:3128" -o acquire::https::proxy=false update
                  - /usr/bin/apt -o acquire::http::proxy="http://10.1.1.1:3128" -o acquire::https::proxy=false install -y apache2 php php-mysql libapache2-mod-php php-cli php-common php-intl php-gd php-mbstring php-xml php-zip php-curl php-xmlrpc unzip open-vm-tools
                users:
                  - name: holuser
                    passwd:
                      name: ${env.deploymentName}-bootstrap-secret
                      key: holuser-passwd
                    lock_passwd: false
                    sudo: ALL=(ALL) NOPASSWD:ALL
                    shell: /bin/bash
                    ssh_authorized_keys:
                      - ssh-rsa 

          storageClass: cluster-wld01-01a-optimal-datastore-default-policy-autoraid
  Virtual_Machine_2:
    type: CCI.Supervisor.Resource
    properties:
      context: ${resource.CCI_Supervisor_Namespace_1.id}
      manifest:
        apiVersion: vmoperator.vmware.com/v1alpha5
        kind: VirtualMachine
        metadata:
          labels:
            lb-selector: ${env.deploymentName}-app # This is how the LB will select VMs
          name: ${env.deploymentName}-vm2
        spec:
          className: best-effort-xsmall
          image:
            kind: VirtualMachineImage
            name: ${input.vm_image_id} #ID of the VM image to build from
          powerState: PoweredOn
          bootstrap:
            cloudInit:
              cloudConfig:
                defaultUserEnabled: true
                runcmd:
                  - /usr/bin/apt -o acquire::http::proxy="http://10.1.1.1:3128" -o acquire::https::proxy=false update
                  - /usr/bin/apt -o acquire::http::proxy="http://10.1.1.1:3128" -o acquire::https::proxy=false install -y apache2 php php-mysql libapache2-mod-php php-cli php-common php-intl php-gd php-mbstring php-xml php-zip php-curl php-xmlrpc unzip open-vm-tools
                users:
                  - name: holuser
                    passwd:
                      name: ${env.deploymentName}-bootstrap-secret
                      key: holuser-passwd
                    lock_passwd: false
                    sudo: ALL=(ALL) NOPASSWD:ALL
                    shell: /bin/bash
                    ssh_authorized_keys:
                      - ssh-rsa 

          storageClass: cluster-wld01-01a-optimal-datastore-default-policy-autoraid
  Username_Secret:
    type: CCI.Supervisor.Resource
    properties:
      context: ${resource.CCI_Supervisor_Namespace_1.id}
      manifest:
        apiVersion: v1
        kind: Secret
        metadata:
          name: ${env.deploymentName}-bootstrap-secret
          namespace: ${resource.CCI_Supervisor_Namespace_1.name}
        stringData:
          holuser-passwd: $6$yu1umgMUJaYMNUxj$tX2b6SPmkR/N1vOtJctU.wdCs7iPeGOnkGZUeIfY53yMhPy4VfvDiJwcZ.8yjy0eLPnXScVAnjqxyFXiqSkds1
