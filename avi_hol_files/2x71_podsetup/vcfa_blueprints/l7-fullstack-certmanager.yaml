formatVersion: 1
inputs:
  namespace:
    title: Namespace
    type: string
    description: Namespace you wish to deploy to
    $data: /data/namespaces?projectId={{project}}
  vm_image_id:
    title: VM image ID
    type: string
    description: the ID of the VM image for building the virtual machine
    $data: /data/namespaceclass-vmimages
resources:
  CCI_Supervisor_Namespace_1:
    type: CCI.Supervisor.Namespace
    properties:
      name: ${input.namespace}
      existing: true
  HttpRoute_1:
    type: CCI.Supervisor.Resource
    properties:
      context: ${resource.CCI_Supervisor_Namespace_1.id}
      manifest:
        apiVersion: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        metadata:
          name: ${env.deploymentName}-httproute
        spec:
          hostnames:
            - ${env.deploymentName}-web.lb.site-a.vcf.lab
          parentRefs:
            - kind: Gateway
              name: ${env.deploymentName}-gateway
          rules:
            - backendRefs:
                - kind: Service
                  name: ${env.deploymentName}-vmservice
                  port: 80
                  weight: 1
              matches:
                - path:
                    type: PathPrefix
                    value: /
  Virtual_Machine_Service_1:
    type: CCI.Supervisor.Resource
    properties:
      context: ${resource.CCI_Supervisor_Namespace_1.id}
      manifest:
        apiVersion: vmoperator.vmware.com/v1alpha5
        kind: VirtualMachineService
        metadata:
          name: ${env.deploymentName}-vmservice
        spec:
          ports:
            - name: http
              port: 80
              protocol: TCP
              targetPort: 80
          selector:
            lb-selector: ${env.deploymentName}-app # This is how the LB will select VMs
          type: ClusterIP # needs to be ClusterIP to generate a layer 7 VS
  Gateway_1:
    type: CCI.Supervisor.Resource
    dependsOn:
      - Certificate_1
    properties:
      context: ${resource.CCI_Supervisor_Namespace_1.id}
      manifest:
        apiVersion: gateway.networking.k8s.io/v1
        kind: Gateway
        metadata:
          name: ${env.deploymentName}-gateway
        spec:
          gatewayClassName: avi-lb
          listeners:
            - allowedRoutes:
                namespaces:
                  from: Same
              hostname: ${env.deploymentName}-web.lb.site-a.vcf.lab
              name: https
              port: 443
              protocol: HTTPS
              tls:
                certificateRefs:
                  - name: ${env.deploymentName}-secret
                mode: Terminate
  Virtual_Machine_1:
    type: CCI.Supervisor.Resource
    properties:
      context: ${resource.CCI_Supervisor_Namespace_1.id}
      manifest:
        apiVersion: vmoperator.vmware.com/v1alpha5
        kind: VirtualMachine
        metadata:
          labels:
            lb-selector: ${env.deploymentName}-app # This is how the LB will select VMs
          name: ${env.deploymentName}-vm1
        spec:
          className: best-effort-xsmall
          image:
            kind: VirtualMachineImage
            name: ${input.vm_image_id} #ID of the VM image to build from
          powerState: PoweredOn
          bootstrap:
            cloudInit:
              cloudConfig:
                defaultUserEnabled: true
                runcmd:
                  - /usr/bin/apt -o acquire::http::proxy="http://10.1.1.1:3128" -o acquire::https::proxy=false update
                  - /usr/bin/apt -o acquire::http::proxy="http://10.1.1.1:3128" -o acquire::https::proxy=false install -y apache2 php php-mysql libapache2-mod-php php-cli php-common php-intl php-gd php-mbstring php-xml php-zip php-curl php-xmlrpc unzip open-vm-tools
                users:
                  - name: holuser
                    passwd:
                      name: ${env.deploymentName}-bootstrap-secret
                      key: holuser-passwd
                    lock_passwd: false
                    sudo: ALL=(ALL) NOPASSWD:ALL
                    shell: /bin/bash
                    ssh_authorized_keys:
                      - ssh-rsa 

          storageClass: cluster-wld01-01a-optimal-datastore-default-policy-autoraid
  Certificate_1:
    type: CCI.Supervisor.Resource
    properties:
      context: ${resource.CCI_Supervisor_Namespace_1.id}
      manifest:
        apiVersion: cert-manager.io/v1
        kind: Certificate
        metadata:
          name: ${env.deploymentName}-secret
        spec:
          commonName: ${env.deploymentName}-web.lb.site-a.vcf.lab
          dnsNames:
            - ${env.deploymentName}-web.lb.site-a.vcf.lab
          issuerRef:
            group: cert-manager.io
            kind: Issuer
            name: vault-issuer
          secretName: ${env.deploymentName}-secret
          usages:
            - digital signature
            - key encipherment
      wait:
        conditions:
          - type: Ready
            status: 'True'
        timeout: 60
  Virtual_Machine_2:
    type: CCI.Supervisor.Resource
    properties:
      context: ${resource.CCI_Supervisor_Namespace_1.id}
      manifest:
        apiVersion: vmoperator.vmware.com/v1alpha5
        kind: VirtualMachine
        metadata:
          labels:
            lb-selector: ${env.deploymentName}-app # This is how the LB will select VMs
          name: ${env.deploymentName}-vm2
        spec:
          className: best-effort-xsmall
          image:
            kind: VirtualMachineImage
            name: ${input.vm_image_id} #ID of the VM image to build from
          powerState: PoweredOn
          bootstrap:
            cloudInit:
              cloudConfig:
                defaultUserEnabled: true
                runcmd:
                  - /usr/bin/apt -o acquire::http::proxy="http://10.1.1.1:3128" -o acquire::https::proxy=false update
                  - /usr/bin/apt -o acquire::http::proxy="http://10.1.1.1:3128" -o acquire::https::proxy=false install -y apache2 php php-mysql libapache2-mod-php php-cli php-common php-intl php-gd php-mbstring php-xml php-zip php-curl php-xmlrpc unzip open-vm-tools
                users:
                  - name: holuser
                    passwd:
                      name: ${env.deploymentName}-bootstrap-secret
                      key: holuser-passwd
                    lock_passwd: false
                    sudo: ALL=(ALL) NOPASSWD:ALL
                    shell: /bin/bash
                    ssh_authorized_keys:
                      - ssh-rsa 
                  
          storageClass: cluster-wld01-01a-optimal-datastore-default-policy-autoraid
  Username_Secret:
    type: CCI.Supervisor.Resource
    properties:
      context: ${resource.CCI_Supervisor_Namespace_1.id}
      manifest:
        apiVersion: v1
        kind: Secret
        metadata:
          name: ${env.deploymentName}-bootstrap-secret
          namespace: ${resource.CCI_Supervisor_Namespace_1.name}
        stringData:
          holuser-passwd: $6$yu1umgMUJaYMNUxj$tX2b6SPmkR/N1vOtJctU.wdCs7iPeGOnkGZUeIfY53yMhPy4VfvDiJwcZ.8yjy0eLPnXScVAnjqxyFXiqSkds1
