# Trust Harbor's CA on VKS workload clusters -- cert embedded, ready to apply.
#
# Same content/purpose as harbor-registry-trust.yaml, but with the actual
# harbor.site-a.vcf.lab CA cert baked in (no placeholder to fill in) since
# all the replica pods pulling from this Harbor need the same trust.
#
# Apply to the SUPERVISOR context, not the workload cluster itself --
# ClusterRegistryConfig is cluster-scoped and propagates to EVERY VKS
# workload cluster under that Supervisor. Propagation is live (no node
# rollout needed) -- typically seconds.
apiVersion: containerregistry.vmware.com/v1alpha1
kind: ClusterRegistryConfig
metadata:
  name: harbor-site-a-vcf-lab
spec:
  server: harbor.site-a.vcf.lab # hostname only, no scheme or path
  caCerts:
  - data: 
