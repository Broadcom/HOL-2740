 # mysql-db is built directly via the vCenter REST API instead of a VM
  # Operator/VPC-networked VirtualMachine (the old mysql-vm.yaml.j2 approach,
  # attached to subnet-public1). Reason: subnet-public1 lives in whatever NSX
  # Project owns this namespace's VPC (Acme-East-A here), and a DFW policy
  # created in the Default project -- which is where 3tierapp-db_policy and
  # every other security-policy/group in this repo live -- never gets
  # realized against objects in a different Project. That's not a bug to
  # work around with cross-Project Shares; it's project isolation working as
  # designed. The fix is to put mysql-db back in Default-project scope, on
  # the same classic NSX segment (wld01-servers) that site1web1/site1web2
  # already use -- confirmed live 2026-08-29 tracing exactly this symptom
  # (a pod with no Antrea Egress-CR membership could still reach mysql-db on
  # 3306 despite a DFW DROP rule that should have blocked it).
    - name: Authenticate to vCenter (workload domain)
      ansible.builtin.uri:
        url: "https://vc-wld01-a.site-a.vcf.lab/api/session"
        method: POST
        url_username: "administrator@wld.sso"
        url_password: "{{ lookup('ansible.builtin.file', '/home/holuser/creds.txt') | trim }}"
        force_basic_auth: true
        validate_certs: false
        status_code: 201
      register: vc_session
      no_log: true

    - name: Set vCenter session header fact
      ansible.builtin.set_fact:
        vc_headers:
          vmware-api-session-id: "{{ vc_session.json }}"
      no_log: true

    - name: Check for an already-existing mysql-db VM
      ansible.builtin.uri:
        url: "https://vc-wld01-a.site-a.vcf.lab/api/vcenter/vm"
        method: GET
        headers: "{{ vc_headers }}"
        validate_certs: false
      register: vc_existing_vms

    # Explicit empty-string fallback rather than `| first` on a possibly-empty
    # selectattr result (which raises) or `default(None)` (which some Ansible
    # versions render as the truthy *string* "None" once passed back through
    # a `{{ }}` template, silently breaking every `when: not
    # existing_mysql_db_vm_id` guard below).
    - name: Note whether mysql-db already exists
      ansible.builtin.set_fact:
        existing_mysql_db_vm_id: >-
          {{ (vc_existing_vms.json | selectattr('name', 'equalto', 'mysql-db') | map(attribute='vm') | list)[0]
            if (vc_existing_vms.json | selectattr('name', 'equalto', 'mysql-db') | list | length > 0)
            else '' }}

    - name: Generate a unique cloud-init instance-id
      ansible.builtin.command: uuidgen
      register: mysql_db_instance_id
      changed_when: false
      when: not existing_mysql_db_vm_id

    - name: Render mysql-db cloud-init user-data
      ansible.builtin.set_fact:
        mysql_db_userdata_b64: "{{ lookup('ansible.builtin.template', '/vpodrepo/2027-labs/2740/avi_hol_files/3-TierAppDeployment/codeSamples/mysql-db-cloudinit.yaml.j2') | b64encode }}"
      vars:
        db_password: "{{ lookup('ansible.builtin.file', '/home/holuser/creds.txt') | trim }}"
      when: not existing_mysql_db_vm_id

    - name: List content library IDs
      ansible.builtin.uri:
        url: "https://vc-wld01-a.site-a.vcf.lab/api/content/library"
        method: GET
        headers: "{{ vc_headers }}"
        validate_certs: false
      register: vc_library_ids
      when: not existing_mysql_db_vm_id

    - name: Get details for each content library
      ansible.builtin.uri:
        url: "https://vc-wld01-a.site-a.vcf.lab/api/content/library/{{ item }}"
        method: GET
        headers: "{{ vc_headers }}"
        validate_certs: false
      loop: "{{ vc_library_ids.json }}"
      register: vc_library_details
      when: not existing_mysql_db_vm_id

    - name: Find the CloudImages library id
      ansible.builtin.set_fact:
        cloudimages_library_id: "{{ (vc_library_details.results | selectattr('json.name', 'equalto', 'CloudImages') | map(attribute='item') | first) }}"
      when: not existing_mysql_db_vm_id

    - name: List items in the CloudImages library
      ansible.builtin.uri:
        url: "https://vc-wld01-a.site-a.vcf.lab/api/content/library/item?library_id={{ cloudimages_library_id }}"
        method: GET
        headers: "{{ vc_headers }}"
        validate_certs: false
      register: vc_cloudimages_item_ids
      when: not existing_mysql_db_vm_id

    - name: Get details for each item in the CloudImages library
      ansible.builtin.uri:
        url: "https://vc-wld01-a.site-a.vcf.lab/api/content/library/item/{{ item }}"
        method: GET
        headers: "{{ vc_headers }}"
        validate_certs: false
      loop: "{{ vc_cloudimages_item_ids.json }}"
      register: vc_cloudimages_item_details
      when: not existing_mysql_db_vm_id

    - name: Find the Ubuntu 24.04 OVF item id
      ansible.builtin.set_fact:
        ubuntu_ovf_item_id: "{{ (vc_cloudimages_item_details.results | selectattr('json.name', 'equalto', 'Ubuntu 24.04') | map(attribute='item') | first) }}"
      when: not existing_mysql_db_vm_id

    - name: List vCenter networks
      ansible.builtin.uri:
        url: "https://vc-wld01-a.site-a.vcf.lab/api/vcenter/network"
        method: GET
        headers: "{{ vc_headers }}"
        validate_certs: false
      register: vc_networks
      when: not existing_mysql_db_vm_id

    - name: Find the wld01-servers network id
      ansible.builtin.set_fact:
        wld01_servers_network_id: "{{ (vc_networks.json | selectattr('name', 'equalto', 'wld01-servers') | map(attribute='network') | first) }}"
      when: not existing_mysql_db_vm_id

    - name: List vCenter resource pools
      ansible.builtin.uri:
        url: "https://vc-wld01-a.site-a.vcf.lab/api/vcenter/resource-pool"
        method: GET
        headers: "{{ vc_headers }}"
        validate_certs: false
      register: vc_resource_pools
      when: not existing_mysql_db_vm_id

    - name: Find the top-level Resources pool id
      ansible.builtin.set_fact:
        vc_resource_pool_id: "{{ (vc_resource_pools.json | selectattr('name', 'equalto', 'Resources') | map(attribute='resource_pool') | first) }}"
      when: not existing_mysql_db_vm_id

    - name: List vCenter VM folders
      ansible.builtin.uri:
        url: "https://vc-wld01-a.site-a.vcf.lab/api/vcenter/folder"
        method: GET
        headers: "{{ vc_headers }}"
        validate_certs: false
      register: vc_folders
      when: not existing_mysql_db_vm_id

    - name: Find the default vm folder id
      ansible.builtin.set_fact:
        vc_vm_folder_id: "{{ (vc_folders.json | selectattr('name', 'equalto', 'vm') | selectattr('type', 'equalto', 'VIRTUAL_MACHINE') | map(attribute='folder') | first) }}"
      when: not existing_mysql_db_vm_id

    - name: List vCenter datastores
      ansible.builtin.uri:
        url: "https://vc-wld01-a.site-a.vcf.lab/api/vcenter/datastore"
        method: GET
        headers: "{{ vc_headers }}"
        validate_certs: false
      register: vc_datastores
      when: not existing_mysql_db_vm_id

    # This workload domain only ever has the one shared vSAN datastore, so no
    # name filter -- just take whatever's first.
    - name: Use the first available datastore
      ansible.builtin.set_fact:
        vc_datastore_id: "{{ vc_datastores.json[0].datastore }}"
      when: not existing_mysql_db_vm_id

  # network_mappings' key ("VM Network") is the OVF descriptor's own internal
  # network label baked into the Ubuntu cloud image -- confirmed live
  # 2026-08-29 via the library item's `?action=filter` response. That's
  # stable across pod rebuilds; only the dvportgroup id on the right-hand
  # side is pod-specific, hence the lookup above instead of hardcoding it.
  #
  # This synchronous deploy call (OVF import + disk clone) has taken well
  # over 30s in practice -- Ansible's uri module default timeout -- and a
  # client-side read timeout does NOT mean the deploy failed: the request
  # was already accepted and vCenter keeps building the VM after Ansible
  # gives up waiting on the response. Confirmed live 2026-08-29 (a run that
  # "failed" here had actually deployed the VM). So: a long explicit
  # timeout as the main defense, plus ignore_errors so a timeout that
  # happens anyway doesn't abort the play -- the retrying vm-id lookup
  # right below this will simply wait for the VM to show up either way.
    - name: Deploy mysql-db from the Ubuntu 24.04 OVF template
      ansible.builtin.uri:
        url: "https://vc-wld01-a.site-a.vcf.lab/api/vcenter/ovf/library-item/{{ ubuntu_ovf_item_id }}?action=deploy"
        method: POST
        headers: "{{ vc_headers }}"
        validate_certs: false
        timeout: 600
        body_format: json
        body:
          target:
            resource_pool_id: "{{ vc_resource_pool_id }}"
            folder_id: "{{ vc_vm_folder_id }}"
          deployment_spec:
            name: "mysql-db"
            annotation: "3-tier app database VM -- see 2740-01-module_1.yaml for why this is deployed directly instead of via VM Operator."
            accept_all_EULA: true
            network_mappings:
              "VM Network": "{{ wld01_servers_network_id }}"
            storage_mappings: {}
            storage_provisioning: thin
            default_datastore_id: "{{ vc_datastore_id }}"
            additional_parameters:
              - "@class": "com.vmware.vcenter.ovf.property_params"
                type: PropertyParams
                properties:
                  - id: instance-id
                    value: "{{ mysql_db_instance_id.stdout }}"
                  - id: hostname
                    value: "mysql-db"
                  - id: user-data
                    value: "{{ mysql_db_userdata_b64 }}"
        status_code: 200
      when: not existing_mysql_db_vm_id
      ignore_errors: true

- hosts: linuxhosts
  # vars:
  #   ansible_password: "{{ lookup('ansible.builtin.env', 'AVICTRL_PASS') }}"
  vars_files:
    - /vpodrepo/2027-labs/2740/avi_hol_files/2x71_podsetup/secrets.yml
  tasks:
    - name: cleanup
      docker_container:
        name: "hackazon"
        state: absent
        force_kill: yes
        container_default_behavior: no_defaults
      # become: yes removed (2026-07-28) - holuser doesn't need sudo for
      # docker on these hosts, same as every other docker task in this
      # block. With no ansible_become_pass configured for the linuxhosts
      # group, this always failed with "Missing sudo password" - harmless
      # since ignore_errors masked it, but pointless. Matches the pattern
      # already used (commented-out become) on the demoweb/avi_demoweb
      # tasks below.
      ignore_errors: yes

    - pause:
        seconds: 10

    - name: start clients
      docker_container:
        name: "hackazon"
        state: started
        restart_policy: always
        container_default_behavior: no_defaults
        env:
          NOLOGO: "yes"
        image: harbor.site-a.vcf.lab/library/hackazon:latest
        ports:
          - "30080:80"
          - "30443:443"
      register: result
      retries: 3
      delay: 3
      #become: yes

    - name: cleanup
      docker_container:
        name: "demoweb"
        state: absent
        force_kill: yes
        container_default_behavior: no_defaults
      #become: yes
      ignore_errors: yes

    - pause:
        seconds: 10

    - name: start clients
      docker_container:
        name: "demoweb"
        state: started
        restart_policy: always
        container_default_behavior: no_defaults
        env:
          NOLOGO: "yes"
        image: harbor.site-a.vcf.lab/library/avi_demoweb:v1
        ports:
          # was "80:30001" (backwards) - the demo_vs-Pool in the Avi
          # playbooks targets workers on port 30001, so the HOST-published
          # port must be 30001 (mapping to the app's actual port 80
          # inside the container), not the other way around. Confirmed via
          # a live pod: the container this produced was only reachable on
          # host port 80, not 30001, meaning Avi's pool traffic to it
          # would fail. Fixed 2026-07-28.
          - "30001:80"
      register: result
      retries: 3
      delay: 3
      #become: yes

    - name: cleanup
      docker_container:
        name: "dvwa"
        state: absent
        force_kill: yes
        container_default_behavior: no_defaults
      ignore_errors: yes

    - pause:
        seconds: 10

    - name: start clients
      docker_container:
        name: "dvwa"
        state: started
        restart_policy: always
        container_default_behavior: no_defaults
        env:
          NOLOGO: "yes"
        image: harbor.site-a.vcf.lab/library/dvwaserver:v1
        ports:
          - "30081:80"
      register: result
      retries: 3
      delay: 3