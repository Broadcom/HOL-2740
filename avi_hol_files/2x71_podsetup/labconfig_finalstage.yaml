    - name: Creates directory
      file:
        path: /etc/ansible/hosts/
        state: directory
      become: yes

    - name: Put inventory file in default location so modswitcher works with non-localhost thingies
      copy:
        src: /vpodrepo/2027-labs/2740/avi_hol_files/2x71_podsetup/inventory.yml
        dest: /etc/ansible/hosts/inventory.yml
      become: yes

    - name: Attempt to install kubernetes packages
      block:
        - name: Try installing directly from the internet
          ansible.builtin.pip:
            name: kubernetes
            state: present
            virtualenv: /home/holuser/py312venv

      rescue:
        - name: Internet failed, try installing via Broadcom Artifactory
          ansible.builtin.pip:
            name: kubernetes
            state: present
            extra_args: --index-url https://packages.vcfd.broadcom.net/artifactory/api/pypi/pypi-remote/simple
            virtualenv: /home/holuser/py312venv



    - name: Configure Docker daemon proxy settings
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        owner: root
        group: root
        mode: '0644'
        content: |
          {
            "proxies": {
              "http-proxy": "http://proxy.site-a.vcf.lab:3128",
              "https-proxy": "http://proxy.site-a.vcf.lab:3128",
              "no-proxy": "localhost,127.0.0.1,harbor.site-a.vcf.lab,.vcf.lab"
            }
          }
      register: docker_daemon_config
      become: true

    - name: Restart Docker service if daemon.json was modified
      ansible.builtin.service:
        name: docker
        state: restarted
      when: docker_daemon_config.changed
      become: true


