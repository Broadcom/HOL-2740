## clean up firefox vcenter state

    - name: Find folders matching the wildcard pattern
      ansible.builtin.find:
        paths: /home/holuser/snap/firefox/common/.mozilla/firefox/hu6lbvyx.default/storage/default
        patterns: "*vc-*"  # Your wildcard pattern here
        file_type: directory
      register: found_folders

    - name: Delete the matched folders
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ found_folders.files }}"

    - name: Delete the cache folder
      ansible.builtin.file:
        path: /home/holuser/snap/firefox/common/.cache/mozilla/firefox/hu6lbvyx.default/cache2
        state: absent


#######
## Settings for adjusting terminal colors for readability

    - name: Set 'ls' directory colors to bold cyan
      ansible.builtin.lineinfile:
        path: ~/.bashrc
        line: 'export LS_COLORS="${LS_COLORS}:di=01;36"'
        state: present
        insertafter: EOF

    - name: Change prompt (PS1) working directory color to cyan
      ansible.builtin.replace:
        path: ~/.bashrc
        # Search for the bold blue color code
        regexp: '01;34m'
        # Replace it with bold cyan
        replace: '01;36m'
        # Constrain the search to only the PS1 prompt section to be safe
        after: 'if \[ "\$color_prompt" = yes \]; then'
        before: 'unset color_prompt'
