all:
  hosts:
    localhost:
  children:
    lmc:
      hosts:
        console.site-a.vcf.lab:
          connection: ssh
          remote_user: holuser 
          ansible_python_interpreter: "{{ansible_playbook_python}}"         
          ansible_password: "{{ lookup('ansible.builtin.file', '/home/holuser/creds.txt') }}"

    avi_controllers:
      hosts:
        alb-a.site-a.vcf.lab:
          ansible_sudo_pass: "{{ lookup('ansible.builtin.env', 'AVICTRL_PASS') }}"
        alb-b.site-a.vcf.lab:
          ansible_sudo_pass: "{{ lookup('ansible.builtin.env', 'AVICTRL_PASS') }}"
    linuxhosts:
      hosts:
        web1.site-a.vcf.lab:
          connection: ssh
          ansible_user: holuser
          ansible_password: "{{ holuser_webserver_password }}"
        web2.site-a.vcf.lab:
          connection: ssh
          ansible_user: holuser
          ansible_password: "{{ holuser_webserver_password }}"
        web1.site-b.vcf.lab:
          connection: ssh
          ansible_user: holuser
          ansible_password: "{{ holuser_webserver_password }}"
        web2.site-b.vcf.lab:
          connection: ssh
          ansible_user: holuser
          ansible_password: "{{ holuser_webserver_password }}"
